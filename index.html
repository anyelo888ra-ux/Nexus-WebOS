<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nexus WebOS - Loading...</title>
  <style>
    body {
      background-color: #0b0d17;
      color: #fff;
      font-family: system-ui, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      margin: 0;
    }
    .loader {
      border: 4px solid rgba(255, 255, 255, 0.1);
      border-left-color: #007aff;
      border-radius: 50%;
      width: 40px;
      height: 40px;
      animation: spin 1s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <div class="loader"></div>
  <p>Detectando entorno de Nexus WebOS...</p>

  <script>
    async function detectEnvironment() {
      // 1. Detección de visores VR / AR (WebXR)
      if (navigator.xr) {
        try {
          const isVRSupported = await navigator.xr.isSessionSupported('immersive-vr');
          const isARSupported = await navigator.xr.isSessionSupported('immersive-ar');
          if (isVRSupported || isARSupported) {
            window.location.href = 'vr.html';
            return;
          }
        } catch (e) {
          console.log("WebXR check bypass:", e);
        }
      }

      // 2. Detección de móviles y tablets
      const isMobileUA = /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent);
      const isSmallScreen = window.innerWidth <= 768;

      if (isMobileUA || isSmallScreen) {
        window.location.href = 'movil.html';
        return;
      }

      // 3. Por defecto: Entorno PC
      window.location.href = 'pc.html';
    }

    setTimeout(detectEnvironment, 500);
  </script>
</body>
</html>
