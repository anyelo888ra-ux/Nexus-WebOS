<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Nexus WebOS - Mobile Mode</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
    body {
      background: linear-gradient(180deg, #0f172a, #020617);
      height: 100vh;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      color: #fff;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 16px;
    }
    .status-bar {
      display: flex;
      justify-content: space-between;
      font-size: 14px;
      font-weight: 600;
      padding: 8px 12px;
    }
    .app-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 20px;
      margin-top: 40px;
    }
    .app-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
    }
    .app-icon {
      width: 60px;
      height: 60px;
      border-radius: 16px;
      background: linear-gradient(135deg, #3b82f6, #1d4ed8);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 26px;
      box-shadow: 0 10px 20px rgba(0,0,0,0.3);
    }
    .app-name { font-size: 12px; opacity: 0.9; }
    .bottom-dock {
      background: rgba(255, 255, 255, 0.1);
      backdrop-filter: blur(16px);
      padding: 14px;
      border-radius: 28px;
      display: flex;
      justify-content: space-around;
      border: 1px solid rgba(255, 255, 255, 0.1);
    }
  </style>
</head>
<body>
  <div class="status-bar">
    <span id="mobile-clock">00:00</span>
    <span>Nexus Mobile 5G</span>
  </div>

  <div class="app-grid">
    <div class="app-item">
      <div class="app-icon">📁</div>
      <span class="app-name">Archivos</span>
    </div>
    <div class="app-item">
      <div class="app-icon" style="background: linear-gradient(135deg, #8b5cf6, #6d28d9);">🌐</div>
      <span class="app-name">Navegador</span>
    </div>
    <div class="app-item">
      <div class="app-icon" style="background: linear-gradient(135deg, #ec4899, #be185d);">🎮</div>
      <span class="app-name">Juegos</span>
    </div>
    <div class="app-item">
      <div class="app-icon" style="background: linear-gradient(135deg, #f59e0b, #b45309);">⚙️</div>
      <span class="app-name">Ajustes</span>
    </div>
  </div>

  <div class="bottom-dock">
    <div class="app-icon" style="width:50px; height:50px; font-size:22px;">📞</div>
    <div class="app-icon" style="width:50px; height:50px; font-size:22px; background: linear-gradient(135deg, #10b981, #047857);">💬</div>
    <div class="app-icon" style="width:50px; height:50px; font-size:22px;">🎵</div>
  </div>

  <script>
    function updateClock() {
      const now = new Date();
      document.getElementById('mobile-clock').innerText = now.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
    }
    setInterval(updateClock, 1000);
    updateClock();
  </script>
</body>
</html>
