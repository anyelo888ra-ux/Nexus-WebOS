<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Nexus WebOS - Mobile Mode</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
    body {
      background: linear-gradient(180deg, #0f172a, #020617);
      height: 100vh;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      color: #fff;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 16px;
      overflow: hidden;
    }
    .status-bar {
      display: flex;
      justify-content: space-between;
      font-size: 14px;
      font-weight: 600;
      padding: 8px 12px;
    }
    .app-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 20px;
      margin-top: 20px;
      padding: 10px;
    }
    .app-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
      cursor: pointer;
    }
    .app-icon {
      width: 60px;
      height: 60px;
      border-radius: 18px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 26px;
      box-shadow: 0 10px 20px rgba(0,0,0,0.4);
      transition: transform 0.1s;
    }
    .app-icon:active { transform: scale(0.9); }
    .app-name { font-size: 12px; opacity: 0.9; text-align: center; }

    /* Modal / Pantalla de App Móvil */
    .app-modal {
      position: absolute;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(15, 23, 42, 0.95);
      backdrop-filter: blur(20px);
      display: none;
      flex-direction: column;
      padding: 24px;
      z-index: 100;
    }
    .app-modal.active { display: flex; }
    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
      font-size: 18px;
      font-weight: bold;
      color: #38bdf8;
    }
    .close-modal {
      background: rgba(255,255,255,0.1);
      border: none; color: #fff;
      padding: 6px 14px; border-radius: 10px;
      cursor: pointer; font-size: 14px;
    }
    .modal-body { flex: 1; overflow-y: auto; color: #cbd5e1; font-size: 15px; }

    .bottom-dock {
      background: rgba(255, 255, 255, 0.08);
      backdrop-filter: blur(16px);
      padding: 14px;
      border-radius: 28px;
      display: flex;
      justify-content: space-around;
      border: 1px solid rgba(255, 255, 255, 0.1);
    }
  </style>
</head>
<body>
  <div class="status-bar">
    <span id="mobile-clock">00:00</span>
    <span>Nexus Mobile 5G 📶</span>
  </div>

  <div class="app-grid">
    <div class="app-item" onclick="openApp('Archivos', 'Contenido del almacenamiento interno:\n\n- /documento.txt (2 KB)\n- /sistema.sys (12 KB)\n- /notas.txt (1 KB)')">
      <div class="app-icon" style="background: linear-gradient(135deg, #10b981, #047857);">📁</div>
      <span class="app-name">Archivos</span>
    </div>
    <div class="app-item" onclick="openApp('Navegador', 'Navegando en red local...\nURL actual: http://0.0.0.0:8080\n\nConexión segura establecida con Vercel y Node.js server.')">
      <div class="app-icon" style="background: linear-gradient(135deg, #3b82f6, #1d4ed8);">🌐</div>
      <span class="app-name">Navegador</span>
    </div>
    <div class="app-item" onclick="openApp('Juegos', '🎮 Centro de Juegos NexusOS\n\n- Minijuego Arcade táctil activo.\n- Toca la pantalla para sumar puntos.')">
      <div class="app-icon" style="background: linear-gradient(135deg, #ec4899, #be185d);">🎮</div>
      <span class="app-name">Juegos</span>
    </div>
    <div class="app-item" onclick="openApp('Ajustes', '⚙️ Ajustes del Sistema:\n\n- Versión: Nexus WebOS 1.0 Mobile\n- Pantalla: 1080x2400 (Responsive)\n- Red: Conectado a WiFi Local')">
      <div class="app-icon" style="background: linear-gradient(135deg, #f59e0b, #b45309);">⚙️</div>
      <span class="app-name">Ajustes</span>
    </div>
  </div>

  <!-- Modal Interactivo para Apps Móviles -->
  <div class="app-modal" id="appModal">
    <div class="modal-header">
      <span id="modalTitle">App</span>
      <button class="close-modal" onclick="closeApp()">Cerrar ✕</button>
    </div>
    <div class="modal-body" id="modalContent" style="white-space: pre-line;">
      Contenido de la aplicación...
    </div>
  </div>

  <div class="bottom-dock">
    <div class="app-icon" style="width:50px; height:50px; font-size:20px; background:rgba(255,255,255,0.1);" onclick="alert('Marcador telefónico virtual activo.')">📞</div>
    <div class="app-icon" style="width:50px; height:50px; font-size:20px; background: linear-gradient(135deg, #10b981, #047857);" onclick="alert('Nexus Chat: Sin mensajes nuevos.')">💬</div>
    <div class="app-icon" style="width:50px; height:50px; font-size:20px; background:rgba(255,255,255,0.1);" onclick="alert('Reproductor Phonk Music en segundo plano activo 🎵.')">🎵</div>
  </div>

  <script>
    function updateClock() {
      const now = new Date();
      document.getElementById('mobile-clock').innerText = now.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
    }
    setInterval(updateClock, 1000);
    updateClock();

    function openApp(appName, content) {
      document.getElementById('modalTitle').innerText = appName;
      document.getElementById('modalContent').innerText = content;
      document.getElementById('appModal').classList.add('active');
    }

    function closeApp() {
      document.getElementById('appModal').classList.remove('active');
    }
  </script>
</body>
</html>
