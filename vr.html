<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nexus WebOS - Spatial Vision Mode</title>
  <style>
    body { margin: 0; overflow: hidden; background-color: #030712; font-family: system-ui, sans-serif; }
    #overlay {
      position: absolute;
      top: 24px;
      left: 24px;
      color: #fff;
      z-index: 10;
      background: rgba(15, 23, 42, 0.75);
      padding: 16px 24px;
      border-radius: 16px;
      backdrop-filter: blur(20px);
      border: 1px solid rgba(255, 255, 255, 0.15);
      box-shadow: 0 20px 40px rgba(0,0,0,0.5);
    }
    #overlay h2 { margin: 0 0 6px 0; font-size: 18px; color: #38bdf8; }
    #overlay p { margin: 0; font-size: 13px; opacity: 0.8; }
  </style>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>
  <div id="overlay">
    <h2>🥽 Nexus Spatial OS</h2>
    <p>Modo Holográfico 3D (VisionOS Nativo)</p>
  </div>

  <script>
    // 1. Estado del Sistema VR
    let currentApp = 'launcher';
    let terminalHistory = ['NexusOS Spatial v1.0', 'Kernel VR Activo.'];
    let fileSystem = [
      { name: 'documento.txt', size: '2 KB', content: 'Archivo cifrado espacial.' },
      { name: 'sistema.sys', size: '12 KB', content: 'Núcleo WebXR online.' }
    ];
    let selectedFile = null;

    // 2. Canvas 2D para renderizar la UI en el panel 3D
    const uiCanvas = document.createElement('canvas');
    uiCanvas.width = 1024;
    uiCanvas.height = 640;
    const ctx = uiCanvas.getContext('2d');

    function drawUI() {
      ctx.clearRect(0, 0, uiCanvas.width, uiCanvas.height);
      
      // Panel Base
      ctx.fillStyle = 'rgba(15, 23, 42, 0.9)';
      ctx.roundRect(0, 0, uiCanvas.width, uiCanvas.height, 32);
      ctx.fill();
      ctx.lineWidth = 4;
      ctx.strokeStyle = 'rgba(56, 189, 248, 0.3)';
      ctx.stroke();

      ctx.fillStyle = '#ffffff';
      ctx.font = 'bold 30px system-ui';
      ctx.fillText('Nexus Spatial OS (VR Mode)', 50, 65);

      if (currentApp !== 'launcher') {
        ctx.fillStyle = '#38bdf8';
        ctx.beginPath();
        ctx.roundRect(860, 30, 110, 48, 14);
        ctx.fill();
        ctx.fillStyle = '#0f172a';
        ctx.font = 'bold 18px system-ui';
        ctx.textAlign = 'center';
        ctx.fillText('🏠 Home', 915, 60);
        ctx.textAlign = 'left';
      }

      if (currentApp === 'launcher') {
        ctx.fillStyle = 'rgba(255, 255, 255, 0.6)';
        ctx.font = '20px system-ui';
        ctx.fillText('Selecciona una aplicación espacial:', 50, 110);

        const apps = [
          { name: 'Navegador', icon: '🌐', color: '#3b82f6', x: 70, y: 170 },
          { name: 'Archivos', icon: '📁', color: '#10b981', x: 250, y: 170 },
          { name: 'Terminal', icon: '💻', color: '#8b5cf6', x: 430, y: 170 },
          { name: 'Juegos', icon: '🎮', color: '#ec4899', x: 610, y: 170 },
          { name: 'Ajustes', icon: '⚙️', color: '#f59e0b', x: 790, y: 170 }
        ];

        apps.forEach(app => {
          ctx.fillStyle = app.color;
          ctx.beginPath();
          ctx.roundRect(app.x, app.y, 140, 140, 28);
          ctx.fill();

          ctx.font = '60px system-ui';
          ctx.textAlign = 'center';
          ctx.fillText(app.icon, app.x + 70, app.y + 90);

          ctx.fillStyle = '#ffffff';
          ctx.font = '20px system-ui';
          ctx.fillText(app.name, app.x + 70, app.y + 180);
        });
        ctx.textAlign = 'left';
      } else if (currentApp === 'Navegador') {
        ctx.fillStyle = '#38bdf8';
        ctx.font = 'bold 22px system-ui';
        ctx.fillText('🌐 Navegador Web Espacial', 50, 110);
        ctx.fillStyle = 'rgba(255, 255, 255, 0.1)';
        ctx.fillRect(50, 130, 924, 50);
        ctx.fillStyle = '#ffffff';
        ctx.font = '18px monospace';
        ctx.fillText('URL: https://nexus-webos.local/vr', 70, 162);
      } else if (currentApp === 'Archivos') {
        ctx.fillStyle = '#10b981';
        ctx.font = 'bold 22px system-ui';
        ctx.fillText('📁 Gestor de Archivos VR', 50, 110);
        fileSystem.forEach((file, index) => {
          ctx.fillStyle = 'rgba(255, 255, 255, 0.08)';
          ctx.fillRect(50, 150 + (index * 60), 400, 50);
          ctx.fillStyle = '#ffffff';
          ctx.font = '18px system-ui';
          ctx.fillText(`📄 ${file.name}`, 70, 182 + (index * 60));
        });
      } else if (currentApp === 'Terminal') {
        ctx.fillStyle = '#8b5cf6';
        ctx.font = 'bold 22px system-ui';
        ctx.fillText('💻 Terminal VR', 50, 110);
        ctx.fillStyle = '#10b981';
        ctx.font = '16px monospace';
        ctx.fillText('> Entorno WebXR sincronizado y listo.', 70, 160);
      } else if (currentApp === 'Juegos') {
        ctx.fillStyle = '#ec4899';
        ctx.font = 'bold 22px system-ui';
        ctx.fillText('🎮 Centro de Juegos VR', 50, 110);
      } else if (currentApp === 'Ajustes') {
        ctx.fillStyle = '#f59e0b';
        ctx.font = 'bold 22px system-ui';
        ctx.fillText('⚙️ Ajustes VR', 50, 110);
        ctx.fillStyle = '#ffffff';
        ctx.font = '18px system-ui';
        ctx.fillText('Modo estereoscópico WebXR: Compatible', 70, 160);
      }

      ctx.fillStyle = 'rgba(255, 255, 255, 0.4)';
      ctx.font = '16px system-ui';
      ctx.fillText('Servidor local activo: 0.0.0.0:8080', 50, 600);
    }

    drawUI();

    // 3. Escena Three.js
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x030712);
    scene.fog = new THREE.FogExp2(0x030712, 0.05);

    const camera = new THREE.PerspectiveCamera(70, window.innerWidth / window.innerHeight, 0.1, 1000);
    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.xr.enabled = true; // Soporte WebXR nativo para visores
    document.body.appendChild(renderer.domElement);

    const ambientLight = new THREE.AmbientLight(0xffffff, 1.2);
    scene.add(ambientLight);

    const pointLight = new THREE.PointLight(0x38bdf8, 2, 50);
    pointLight.position.set(0, 5, 2);
    scene.add(pointLight);

    const texture = new THREE.CanvasTexture(uiCanvas);
    const windowGeometry = new THREE.PlaneGeometry(4, 2.5);
    const windowMaterial = new THREE.MeshBasicMaterial({
      map: texture,
      transparent: true,
      side: THREE.DoubleSide
    });
    const spatialWindow = new THREE.Mesh(windowGeometry, windowMaterial);
    spatialWindow.position.set(0, 0, -3.8);
    scene.add(spatialWindow);

    const gridHelper = new THREE.GridHelper(30, 30, 0x38bdf8, 0x1e293b);
    gridHelper.position.set(0, -2, -4);
    scene.add(gridHelper);

    const particlesGeometry = new THREE.BufferGeometry();
    const particlesCount = 300;
    const posArray = new Float32Array(particlesCount * 3);
    for(let i = 0; i < particlesCount * 3; i++) {
      posArray[i] = (Math.random() - 0.5) * 30;
    }
    particlesGeometry.setAttribute('position', new THREE.BufferAttribute(posArray, 3));
    const particlesMaterial = new THREE.PointsMaterial({ size: 0.05, color: 0x38bdf8 });
    const particlesMesh = new THREE.Points(particlesGeometry, particlesMaterial);
    scene.add(particlesMesh);

    // 4. Raycaster para clics en VR
    const raycaster = new THREE.Raycaster();
    const mouse = new THREE.Vector2();

    window.addEventListener('click', (event) => {
      mouse.x = (event.clientX / window.innerWidth) * 2 - 1;
      mouse.y = -(event.clientY / window.innerHeight) * 2 + 1;

      raycaster.setFromCamera(mouse, camera);
      const intersects = raycaster.intersectObject(spatialWindow);

      if (intersects.length > 0) {
        const uv = intersects[0].uv;
        const cx = uv.x * uiCanvas.width;
        const cy = (1 - uv.y) * uiCanvas.height;

        if (currentApp !== 'launcher' && cx >= 860 && cx <= 970 && cy >= 30 && cy <= 78) {
          currentApp = 'launcher';
          drawUI();
          texture.needsUpdate = true;
          return;
        }

        if (currentApp === 'launcher') {
          const apps = [
            { name: 'Navegador', x: 70 },
            { name: 'Archivos', x: 250 },
            { name: 'Terminal', x: 430 },
            { name: 'Juegos', x: 610 },
            { name: 'Ajustes', x: 790 }
          ];

          apps.forEach(app => {
            if (cx >= app.x && cx <= app.x + 140 && cy >= 170 && cy <= 310) {
              currentApp = app.name;
              drawUI();
              texture.needsUpdate = true;
            }
          });
        }
      }
    });

    const clock = new THREE.Clock();
    function animate() {
      renderer.setAnimationLoop(() => {
        const elapsedTime = clock.getElapsedTime();
        spatialWindow.position.y = Math.sin(elapsedTime * 1.5) * 0.08;
        particlesMesh.rotation.y = elapsedTime * 0.03;
        renderer.render(scene, camera);
      });
    }
    animate();

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });
  </script>
</body>
</html>
