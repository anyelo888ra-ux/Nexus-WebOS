<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nexus WebOS - Spatial PC Simulator</title>
  <style>
    body { margin: 0; overflow: hidden; background-color: #030712; font-family: system-ui, sans-serif; }
    #overlay {
      position: absolute;
      top: 24px;
      left: 24px;
      color: #fff;
      z-index: 10;
      background: rgba(15, 23, 42, 0.75);
      padding: 16px 24px;
      border-radius: 16px;
      backdrop-filter: blur(20px);
      border: 1px solid rgba(255, 255, 255, 0.15);
      box-shadow: 0 20px 40px rgba(0,0,0,0.5);
    }
    #overlay h2 { margin: 0 0 6px 0; font-size: 18px; color: #38bdf8; }
    #overlay p { margin: 0; font-size: 13px; opacity: 0.8; }
    
    .back-btn {
      position: absolute;
      bottom: 24px;
      left: 24px;
      z-index: 10;
      background: rgba(255, 255, 255, 0.1);
      color: #fff;
      border: 1px solid rgba(255, 255, 255, 0.2);
      padding: 10px 20px;
      border-radius: 12px;
      cursor: pointer;
      backdrop-filter: blur(10px);
      font-weight: 600;
      transition: background 0.2s;
    }
    .back-btn:hover { background: rgba(255, 255, 255, 0.2); }

    /* Stream de Cámara para Hand Tracking */
    #webcam-container {
      position: absolute;
      top: 24px;
      right: 24px;
      z-index: 10;
      width: 180px;
      height: 120px;
      border-radius: 16px;
      overflow: hidden;
      border: 1px solid rgba(56, 189, 248, 0.4);
      background: rgba(15, 23, 42, 0.8);
      backdrop-filter: blur(10px);
    }
    #webcam {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transform: scaleX(-1);
    }
    .cam-status {
      position: absolute;
      bottom: 6px;
      left: 8px;
      font-size: 10px;
      color: #38bdf8;
      background: rgba(0, 0, 0, 0.6);
      padding: 2px 6px;
      border-radius: 6px;
    }
  </style>

  <!-- Bibliotecas externas -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>
</head>
<body>
  <div id="overlay">
    <h2>🥽 Nexus Spatial OS</h2>
    <p>Control: Mouse o Gestos de Mano (Cámara Web)</p>
  </div>

  <button class="back-btn" onclick="window.location.href='pc.html'">← Volver a PC Mode</button>

  <div id="webcam-container">
    <video id="webcam" autoplay playsinline muted></video>
    <div class="cam-status" id="cam-status">Iniciando cámara...</div>
  </div>

  <script>
    // 1. Estado del Sistema WebOS
    let currentApp = 'launcher'; 
    let terminalHistory = [
      'NexusOS v1.0 Kernel (Spatial Edition)',
      'Escribe "help" para ver los comandos disponibles.'
    ];
    let fileSystem = [
      { name: 'documento.txt', size: '2 KB', content: '¡Bienvenido a Nexus WebOS Spatial!' },
      { name: 'sistema.sys', size: '12 KB', content: 'Configuración del núcleo de NexusOS' },
      { name: 'notas.txt', size: '1 KB', content: 'Recuerda probar los gestos con la mano.' }
    ];
    let selectedFile = null;
    let gameState = { score: 0, targetX: 300, targetY: 250 };
    let browserUrl = 'https://bing.com';

    // 2. Canvas 2D para renderizar la UI de las aplicaciones en 3D
    const uiCanvas = document.createElement('canvas');
    uiCanvas.width = 1024;
    uiCanvas.height = 640;
    const ctx = uiCanvas.getContext('2d');

    function drawUI() {
      ctx.clearRect(0, 0, uiCanvas.width, uiCanvas.height);
      
      // Panel Base
      ctx.fillStyle = 'rgba(15, 23, 42, 0.9)';
      ctx.roundRect(0, 0, uiCanvas.width, uiCanvas.height, 32);
      ctx.fill();
      ctx.lineWidth = 4;
      ctx.strokeStyle = 'rgba(56, 189, 248, 0.3)';
      ctx.stroke();

      // Header Global
      ctx.fillStyle = '#ffffff';
      ctx.font = 'bold 30px system-ui';
      ctx.fillText('Nexus Spatial OS', 50, 65);

      // Botón Home si no estamos en el Launcher
      if (currentApp !== 'launcher') {
        ctx.fillStyle = '#38bdf8';
        ctx.beginPath();
        ctx.roundRect(860, 30, 110, 48, 14);
        ctx.fill();
        ctx.fillStyle = '#0f172a';
        ctx.font = 'bold 18px system-ui';
        ctx.textAlign = 'center';
        ctx.fillText('🏠 Home', 915, 60);
        ctx.textAlign = 'left';
      }

      // Render de la app correspondiente
      switch(currentApp) {
        case 'launcher':
          renderLauncher();
          break;
        case 'Navegador':
          renderBrowser();
          break;
        case 'Archivos':
          renderFiles();
          break;
        case 'Terminal':
          renderTerminal();
          break;
        case 'Juegos':
          renderGame();
          break;
        case 'Ajustes':
          renderSettings();
          break;
      }

      // Footer
      ctx.textAlign = 'left';
      ctx.fillStyle = 'rgba(255, 255, 255, 0.4)';
      ctx.font = '16px system-ui';
      ctx.fillText('Servidor local activo: 0.0.0.0:8080 | Estado: En Ejecución', 50, 600);
    }

    // --- RENDERS DE APLICACIONES ---

    function renderLauncher() {
      ctx.fillStyle = 'rgba(255, 255, 255, 0.6)';
      ctx.font = '20px system-ui';
      ctx.fillText('Selecciona una aplicación para iniciar:', 50, 110);

      const apps = [
        { name: 'Navegador', icon: '🌐', color: '#3b82f6', x: 70, y: 170 },
        { name: 'Archivos', icon: '📁', color: '#10b981', x: 250, y: 170 },
        { name: 'Terminal', icon: '💻', color: '#8b5cf6', x: 430, y: 170 },
        { name: 'Juegos', icon: '🎮', color: '#ec4899', x: 610, y: 170 },
        { name: 'Ajustes', icon: '⚙️', color: '#f59e0b', x: 790, y: 170 }
      ];

      apps.forEach(app => {
        ctx.fillStyle = app.color;
        ctx.beginPath();
        ctx.roundRect(app.x, app.y, 140, 140, 28);
        ctx.fill();

        ctx.font = '60px system-ui';
        ctx.textAlign = 'center';
        ctx.fillText(app.icon, app.x + 70, app.y + 90);

        ctx.fillStyle = '#ffffff';
        ctx.font = '20px system-ui';
        ctx.fillText(app.name, app.x + 70, app.y + 180);
      });
      ctx.textAlign = 'left';
    }

    function renderBrowser() {
      ctx.fillStyle = '#38bdf8';
      ctx.font = 'bold 22px system-ui';
      ctx.fillText('🌐 Navegador Espacial', 50, 110);

      // Barra de Navegación
      ctx.fillStyle = 'rgba(255, 255, 255, 0.1)';
      ctx.beginPath();
      ctx.roundRect(50, 130, 924, 50, 12);
      ctx.fill();

      ctx.fillStyle = '#ffffff';
      ctx.font = '18px monospace';
      ctx.fillText(`URL: ${browserUrl}`, 70, 162);

      // Ventana de Contenido
      ctx.fillStyle = 'rgba(30, 41, 59, 0.8)';
      ctx.beginPath();
      ctx.roundRect(50, 200, 924, 360, 16);
      ctx.fill();

      ctx.fillStyle = '#94a3b8';
      ctx.font = '20px system-ui';
      ctx.textAlign = 'center';
      ctx.fillText('Vista previa simulada de la web', 512, 350);
      ctx.font = '16px system-ui';
      ctx.fillText('Toca la barra de búsqueda para cambiar de página', 512, 390);
      ctx.textAlign = 'left';
    }

    function renderFiles() {
      ctx.fillStyle = '#10b981';
      ctx.font = 'bold 22px system-ui';
      ctx.fillText('📁 Gestor de Archivos - /root/home', 50, 110);

      // Lista de archivos
      fileSystem.forEach((file, index) => {
        const y = 150 + (index * 60);
        ctx.fillStyle = selectedFile === file ? 'rgba(16, 185, 129, 0.3)' : 'rgba(255, 255, 255, 0.08)';
        ctx.beginPath();
        ctx.roundRect(50, y, 400, 50, 10);
        ctx.fill();

        ctx.fillStyle = '#ffffff';
        ctx.font = '18px system-ui';
        ctx.fillText(`📄 ${file.name}`, 70, y + 32);
        ctx.fillStyle = '#94a3b8';
        ctx.fillText(file.size, 380, y + 32);
      });

      // Panel de lectura
      ctx.fillStyle = 'rgba(30, 41, 59, 0.8)';
      ctx.beginPath();
      ctx.roundRect(480, 150, 494, 400, 16);
      ctx.fill();

      ctx.fillStyle = '#ffffff';
      ctx.font = 'bold 18px system-ui';
      ctx.fillText(selectedFile ? `Detalles: ${selectedFile.name}` : 'Selecciona un archivo', 510, 190);

      if (selectedFile) {
        ctx.fillStyle = '#cbd5e1';
        ctx.font = '16px monospace';
        ctx.fillText(selectedFile.content, 510, 240);
      }
    }

    function renderTerminal() {
      ctx.fillStyle = '#8b5cf6';
      ctx.font = 'bold 22px system-ui';
      ctx.fillText('💻 Consola de Comandos (Nexus CLI)', 50, 110);

      ctx.fillStyle = 'rgba(15, 23, 42, 0.95)';
      ctx.beginPath();
      ctx.roundRect(50, 130, 924, 430, 16);
      ctx.fill();
      ctx.strokeStyle = '#8b5cf6';
      ctx.stroke();

      ctx.fillStyle = '#10b981';
      ctx.font = '16px monospace';
      
      let startY = 165;
      terminalHistory.slice(-14).forEach(line => {
        ctx.fillText(`> ${line}`, 70, startY);
        startY += 26;
      });

      // Botones de Comando Rápido
      const cmdBtns = ['help', 'ls', 'ping', 'clear', 'matrix'];
      cmdBtns.forEach((cmd, i) => {
        ctx.fillStyle = 'rgba(139, 92, 246, 0.3)';
        ctx.beginPath();
        ctx.roundRect(70 + (i * 110), 510, 95, 36, 8);
        ctx.fill();

        ctx.fillStyle = '#ffffff';
        ctx.font = 'bold 14px monospace';
        ctx.textAlign = 'center';
        ctx.fillText(cmd, 70 + (i * 110) + 47, 533);
      });
      ctx.textAlign = 'left';
    }

    function renderGame() {
      ctx.fillStyle = '#ec4899';
      ctx.font = 'bold 22px system-ui';
      ctx.fillText(`🎮 Mini Juego Arcade - Puntuación: ${gameState.score}`, 50, 110);

      ctx.fillStyle = 'rgba(30, 41, 59, 0.8)';
      ctx.beginPath();
      ctx.roundRect(50, 130, 924, 430, 16);
      ctx.fill();

      // Diana flotante
      ctx.fillStyle = '#ec4899';
      ctx.beginPath();
      ctx.arc(gameState.targetX, gameState.targetY, 35, 0, Math.PI * 2);
      ctx.fill();

      ctx.fillStyle = '#ffffff';
      ctx.beginPath();
      ctx.arc(gameState.targetX, gameState.targetY, 18, 0, Math.PI * 2);
      ctx.fill();

      ctx.fillStyle = '#cbd5e1';
      ctx.font = '18px system-ui';
      ctx.fillText('¡Toca la diana con el dedo o el ratón para ganar puntos!', 70, 530);
    }

    function renderSettings() {
      ctx.fillStyle = '#f59e0b';
      ctx.font = 'bold 22px system-ui';
      ctx.fillText('⚙️ Ajustes del Sistema Operativo', 50, 110);

      const options = [
        'Renderizado: 60 FPS (Optimizado)',
        'Efectos Espaciales 3D: Activados',
        'Hand Tracking (Cámara Web): Sensibilidad Alta',
        'Sincronización Server (Node.js): Activa (0.0.0.0:8080)'
      ];

      options.forEach((opt, index) => {
        const y = 160 + (index * 70);
        ctx.fillStyle = 'rgba(255, 255, 255, 0.08)';
        ctx.beginPath();
        ctx.roundRect(50, y, 924, 55, 12);
        ctx.fill();

        ctx.fillStyle = '#ffffff';
        ctx.font = '18px system-ui';
        ctx.fillText(opt, 80, y + 34);
      });
    }

    drawUI();

    // 3. Escena 3D Three.js
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x030712);
    scene.fog = new THREE.FogExp2(0x030712, 0.05);

    const camera = new THREE.PerspectiveCamera(70, window.innerWidth / window.innerHeight, 0.1, 1000);
    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    document.body.appendChild(renderer.domElement);

    const ambientLight = new THREE.AmbientLight(0xffffff, 1.2);
    scene.add(ambientLight);

    const pointLight = new THREE.PointLight(0x38bdf8, 2, 50);
    pointLight.position.set(0, 5, 2);
    scene.add(pointLight);

    // Ventana holográfica 3D
    const texture = new THREE.CanvasTexture(uiCanvas);
    const windowGeometry = new THREE.PlaneGeometry(4, 2.5);
    const windowMaterial = new THREE.MeshBasicMaterial({
      map: texture,
      transparent: true,
      side: THREE.DoubleSide
    });
    const spatialWindow = new THREE.Mesh(windowGeometry, windowMaterial);
    spatialWindow.position.set(0, 0, -3.8);
    scene.add(spatialWindow);

    // Cursor 3D
    const cursorGeometry = new THREE.SphereGeometry(0.06, 16, 16);
    const cursorMaterial = new THREE.MeshBasicMaterial({ color: 0x38bdf8, transparent: true, opacity: 0.8 });
    const handCursor = new THREE.Mesh(cursorGeometry, cursorMaterial);
    handCursor.position.set(0, 0, -3.7);
    scene.add(handCursor);

    // Grid y Estrellas
    const gridHelper = new THREE.GridHelper(30, 30, 0x38bdf8, 0x1e293b);
    gridHelper.position.set(0, -2, -4);
    scene.add(gridHelper);

    const particlesGeometry = new THREE.BufferGeometry();
    const particlesCount = 300;
    const posArray = new Float32Array(particlesCount * 3);
    for(let i = 0; i < particlesCount * 3; i++) {
      posArray[i] = (Math.random() - 0.5) * 30;
    }
    particlesGeometry.setAttribute('position', new THREE.BufferAttribute(posArray, 3));
    const particlesMaterial = new THREE.PointsMaterial({ size: 0.05, color: 0x38bdf8 });
    const particlesMesh = new THREE.Points(particlesGeometry, particlesMaterial);
    scene.add(particlesMesh);

    // 4. Lógica de Interacción Espacial
    const raycaster = new THREE.Raycaster();
    const pointerVector = new THREE.Vector2();

    function triggerClickAt(normalizedX, normalizedY) {
      pointerVector.x = normalizedX;
      pointerVector.y = normalizedY;

      raycaster.setFromCamera(pointerVector, camera);
      const intersects = raycaster.intersectObject(spatialWindow);

      if (intersects.length > 0) {
        const uv = intersects[0].uv;
        const cx = uv.x * uiCanvas.width;
        const cy = (1 - uv.y) * uiCanvas.height;

        // Clic en Botón Home
        if (currentApp !== 'launcher' && cx >= 860 && cx <= 970 && cy >= 30 && cy <= 78) {
          currentApp = 'launcher';
          drawUI();
          texture.needsUpdate = true;
          return;
        }

        // Interacciones según App
        if (currentApp === 'launcher') {
          const apps = [
            { name: 'Navegador', x: 70 },
            { name: 'Archivos', x: 250 },
            { name: 'Terminal', x: 430 },
            { name: 'Juegos', x: 610 },
            { name: 'Ajustes', x: 790 }
          ];

          apps.forEach(app => {
            if (cx >= app.x && cx <= app.x + 140 && cy >= 170 && cy <= 310) {
              currentApp = app.name;
              drawUI();
              texture.needsUpdate = true;
            }
          });
        } else if (currentApp === 'Archivos') {
          fileSystem.forEach((file, i) => {
            const y = 150 + (i * 60);
            if (cx >= 50 && cx <= 450 && cy >= y && cy <= y + 50) {
              selectedFile = file;
              drawUI();
              texture.needsUpdate = true;
            }
          });
        } else if (currentApp === 'Terminal') {
          const cmdBtns = [
            { name: 'help', action: () => terminalHistory.push('Comandos: help, ls, ping, clear, matrix') },
            { name: 'ls', action: () => terminalHistory.push('documento.txt  sistema.sys  notas.txt') },
            { name: 'ping', action: () => terminalHistory.push('PING 0.0.0.0:8080 - 0.2ms latency [OK]') },
            { name: 'clear', action: () => terminalHistory = ['Consola limpia.'] },
            { name: 'matrix', action: () => terminalHistory.push('01001110 01100101 01111000 01110101 01110011') }
          ];

          cmdBtns.forEach((cmd, i) => {
            const bx = 70 + (i * 110);
            if (cx >= bx && cx <= bx + 95 && cy >= 510 && cy <= 546) {
              cmd.action();
              drawUI();
              texture.needsUpdate = true;
            }
          });
        } else if (currentApp === 'Juegos') {
          const dist = Math.hypot(cx - gameState.targetX, cy - gameState.targetY);
          if (dist <= 40) {
            gameState.score += 10;
            gameState.targetX = 150 + Math.random() * 700;
            gameState.targetY = 200 + Math.random() * 280;
            drawUI();
            texture.needsUpdate = true;
          }
        } else if (currentApp === 'Navegador') {
          if (cx >= 50 && cx <= 974 && cy >= 130 && cy <= 180) {
            const urls = ['https://bing.com', 'https://github.com', 'https://wikipedia.org', 'https://vercel.com'];
            browserUrl = urls[Math.floor(Math.random() * urls.length)];
            drawUI();
            texture.needsUpdate = true;
          }
        }
      }
    }

    // Interacción Mouse
    window.addEventListener('click', (event) => {
      const mouseX = (event.clientX / window.innerWidth) * 2 - 1;
      const mouseY = -(event.clientY / window.innerHeight) * 2 + 1;
      triggerClickAt(mouseX, mouseY);
    });

    // 5. MediaPipe Hands
    const videoElement = document.getElementById('webcam');
    const statusElement = document.getElementById('cam-status');
    let isPinching = false;

    function onHandResults(results) {
      if (results.multiHandLandmarks && results.multiHandLandmarks.length > 0) {
        statusElement.innerText = "Mano detectada";
        statusElement.style.color = "#10b981";

        const landmarks = results.multiHandLandmarks[0];
        const indexFinger = landmarks[8];
        const thumb = landmarks[4];

        const handX = -(indexFinger.x * 2 - 1);
        const handY = -(indexFinger.y * 2 - 1);

        handCursor.position.x = handX * 2.5;
        handCursor.position.y = handY * 1.5;

        const distance = Math.hypot(indexFinger.x - thumb.x, indexFinger.y - thumb.y);

        if (distance < 0.08) {
          if (!isPinching) {
            isPinching = true;
            handCursor.material.color.setHex(0x10b981);
            triggerClickAt(handX, handY);
          }
        } else {
          isPinching = false;
          handCursor.material.color.setHex(0x38bdf8);
        }
      } else {
        statusElement.innerText = "Buscando mano...";
        statusElement.style.color = "#38bdf8";
      }
    }

    const hands = new Hands({
      locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`
    });

    hands.setOptions({
      maxNumHands: 1,
      modelComplexity: 1,
      minDetectionConfidence: 0.6,
      minTrackingConfidence: 0.6
    });

    hands.onResults(onHandResults);

    const cameraUtils = new Camera(videoElement, {
      onFrame: async () => {
        await hands.send({ image: videoElement });
      },
      width: 320,
      height: 240
    });

    cameraUtils.start().catch(() => {
      statusElement.innerText = "Cam no disponible (Usa mouse)";
      statusElement.style.color = "#ef4444";
    });

    // Bucle de Animación
    const clock = new THREE.Clock();
    function animate() {
      requestAnimationFrame(animate);
      const elapsedTime = clock.getElapsedTime();
      spatialWindow.position.y = Math.sin(elapsedTime * 1.5) * 0.08;
      particlesMesh.rotation.y = elapsedTime * 0.03;
      renderer.render(scene, camera);
    }
    animate();

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });
  </script>
</body>
</html>
