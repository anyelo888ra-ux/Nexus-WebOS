<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nexus WebOS - Spatial PC Simulator</title>
  <style>
    body { margin: 0; overflow: hidden; background-color: #030712; font-family: system-ui, sans-serif; }
    #overlay {
      position: absolute;
      top: 24px;
      left: 24px;
      color: #fff;
      z-index: 10;
      background: rgba(15, 23, 42, 0.75);
      padding: 16px 24px;
      border-radius: 16px;
      backdrop-filter: blur(20px);
      border: 1px solid rgba(255, 255, 255, 0.15);
      box-shadow: 0 20px 40px rgba(0,0,0,0.5);
    }
    #overlay h2 { margin: 0 0 6px 0; font-size: 18px; color: #38bdf8; }
    #overlay p { margin: 0; font-size: 13px; opacity: 0.8; }
    
    .back-btn {
      position: absolute;
      bottom: 24px;
      left: 24px;
      z-index: 10;
      background: rgba(255, 255, 255, 0.1);
      color: #fff;
      border: 1px solid rgba(255, 255, 255, 0.2);
      padding: 10px 20px;
      border-radius: 12px;
      cursor: pointer;
      backdrop-filter: blur(10px);
      font-weight: 600;
      transition: background 0.2s;
    }
    .back-btn:hover { background: rgba(255, 255, 255, 0.2); }

    /* Stream de Cámara para Hand Tracking */
    #webcam-container {
      position: absolute;
      top: 24px;
      right: 24px;
      z-index: 10;
      width: 180px;
      height: 120px;
      border-radius: 16px;
      overflow: hidden;
      border: 1px solid rgba(56, 189, 248, 0.4);
      background: rgba(15, 23, 42, 0.8);
      backdrop-filter: blur(10px);
    }
    #webcam {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transform: scaleX(-1); /* Espejo horizontal */
    }
    .cam-status {
      position: absolute;
      bottom: 6px;
      left: 8px;
      font-size: 10px;
      color: #38bdf8;
      background: rgba(0, 0, 0, 0.6);
      padding: 2px 6px;
      border-radius: 6px;
    }
  </style>

  <!-- Bibliotecas externas (Three.js + MediaPipe Hands) -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>
</head>
<body>
  <div id="overlay">
    <h2>🥽 Nexus Spatial OS</h2>
    <p>Control: Mouse o Gestos de Mano (Cámara Web)</p>
  </div>

  <button class="back-btn" onclick="window.location.href='pc.html'">← Volver a PC Mode</button>

  <div id="webcam-container">
    <video id="webcam" autoplay playsinline muted></video>
    <div class="cam-status" id="cam-status">Iniciando cámara...</div>
  </div>

  <script>
    // 1. Canvas 2D para renderizar la interfaz de usuario de las apps
    const uiCanvas = document.createElement('canvas');
    uiCanvas.width = 1024;
    uiCanvas.height = 640;
    const ctx = uiCanvas.getContext('2d');

    function drawUI(activeApp = '') {
      ctx.clearRect(0, 0, uiCanvas.width, uiCanvas.height);
      ctx.fillStyle = 'rgba(15, 23, 42, 0.85)';
      ctx.roundRect(0, 0, uiCanvas.width, uiCanvas.height, 32);
      ctx.fill();
      ctx.lineWidth = 4;
      ctx.strokeStyle = 'rgba(255, 255, 255, 0.2)';
      ctx.stroke();

      ctx.fillStyle = '#ffffff';
      ctx.font = 'bold 36px system-ui';
      ctx.fillText('Nexus WebOS Apps', 60, 80);

      ctx.fillStyle = 'rgba(255, 255, 255, 0.6)';
      ctx.font = '22px system-ui';
      ctx.fillText(activeApp ? `App Activa: ${activeApp}` : 'Selecciona una aplicación espacial', 60, 120);

      const apps = [
        { name: 'Navegador', icon: '🌐', color: '#3b82f6', x: 80, y: 180 },
        { name: 'Archivos', icon: '📁', color: '#10b981', x: 260, y: 180 },
        { name: 'Terminal', icon: '💻', color: '#8b5cf6', x: 440, y: 180 },
        { name: 'Juegos', icon: '🎮', color: '#ec4899', x: 620, y: 180 },
        { name: 'Ajustes', icon: '⚙️', color: '#f59e0b', x: 800, y: 180 }
      ];

      apps.forEach(app => {
        ctx.fillStyle = app.color;
        ctx.beginPath();
        ctx.roundRect(app.x, app.y, 140, 140, 28);
        ctx.fill();

        ctx.font = '64px system-ui';
        ctx.textAlign = 'center';
        ctx.fillText(app.icon, app.x + 70, app.y + 92);

        ctx.fillStyle = '#ffffff';
        ctx.font = '20px system-ui';
        ctx.fillText(app.name, app.x + 70, app.y + 180);
      });

      ctx.textAlign = 'left';
      ctx.fillStyle = 'rgba(255, 255, 255, 0.4)';
      ctx.font = '18px system-ui';
      ctx.fillText('Servidor activo en local: 0.0.0.0:8080', 60, 580);
    }

    drawUI();

    // 2. Escena 3D
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x030712);
    scene.fog = new THREE.FogExp2(0x030712, 0.05);

    const camera = new THREE.PerspectiveCamera(70, window.innerWidth / window.innerHeight, 0.1, 1000);
    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    document.body.appendChild(renderer.domElement);

    const ambientLight = new THREE.AmbientLight(0xffffff, 1.2);
    scene.add(ambientLight);

    const pointLight = new THREE.PointLight(0x38bdf8, 2, 50);
    pointLight.position.set(0, 5, 2);
    scene.add(pointLight);

    // Ventana holográfica principal
    const texture = new THREE.CanvasTexture(uiCanvas);
    const windowGeometry = new THREE.PlaneGeometry(4, 2.5);
    const windowMaterial = new THREE.MeshBasicMaterial({
      map: texture,
      transparent: true,
      side: THREE.DoubleSide
    });
    const spatialWindow = new THREE.Mesh(windowGeometry, windowMaterial);
    spatialWindow.position.set(0, 0, -3.8);
    scene.add(spatialWindow);

    // Cursor Holográfico 3D para seguimiento de dedos
    const cursorGeometry = new THREE.SphereGeometry(0.06, 16, 16);
    const cursorMaterial = new THREE.MeshBasicMaterial({ color: 0x38bdf8, transparent: true, opacity: 0.8 });
    const handCursor = new THREE.Mesh(cursorGeometry, cursorMaterial);
    handCursor.position.set(0, 0, -3.7);
    scene.add(handCursor);

    // Entorno (Grid y Partículas)
    const gridHelper = new THREE.GridHelper(30, 30, 0x38bdf8, 0x1e293b);
    gridHelper.position.set(0, -2, -4);
    scene.add(gridHelper);

    const particlesGeometry = new THREE.BufferGeometry();
    const particlesCount = 300;
    const posArray = new Float32Array(particlesCount * 3);
    for(let i = 0; i < particlesCount * 3; i++) {
      posArray[i] = (Math.random() - 0.5) * 30;
    }
    particlesGeometry.setAttribute('position', new THREE.BufferAttribute(posArray, 3));
    const particlesMaterial = new THREE.PointsMaterial({ size: 0.05, color: 0x38bdf8 });
    const particlesMesh = new THREE.Points(particlesGeometry, particlesMaterial);
    scene.add(particlesMesh);

    // 3. Sistema de Interacción (Mouse + Raycaster)
    const raycaster = new THREE.Raycaster();
    const pointerVector = new THREE.Vector2();

    function triggerClickAt(normalizedX, normalizedY) {
      pointerVector.x = normalizedX;
      pointerVector.y = normalizedY;

      raycaster.setFromCamera(pointerVector, camera);
      const intersects = raycaster.intersectObject(spatialWindow);

      if (intersects.length > 0) {
        const uv = intersects[0].uv;
        const canvasX = uv.x * uiCanvas.width;
        const canvasY = (1 - uv.y) * uiCanvas.height;

        const apps = [
          { name: 'Navegador Web', x: 80 },
          { name: 'Gestor de Archivos', x: 260 },
          { name: 'Terminal de Comando', x: 440 },
          { name: 'Centro de Juegos', x: 620 },
          { name: 'Configuración', x: 800 }
        ];

        apps.forEach(app => {
          if (canvasX >= app.x && canvasX <= app.x + 140 && canvasY >= 180 && canvasY <= 320) {
            drawUI(app.name);
            texture.needsUpdate = true;
          }
        });
      }
    }

    // Interacción por Ratón
    window.addEventListener('click', (event) => {
      const mouseX = (event.clientX / window.innerWidth) * 2 - 1;
      const mouseY = -(event.clientY / window.innerHeight) * 2 + 1;
      triggerClickAt(mouseX, mouseY);
    });

    // 4. Integración de MediaPipe Hands (Detección de Cámara)
    const videoElement = document.getElementById('webcam');
    const statusElement = document.getElementById('cam-status');
    let isPinching = false;

    function onHandResults(results) {
      if (results.multiHandLandmarks && results.multiHandLandmarks.length > 0) {
        statusElement.innerText = "Mano detectada";
        statusElement.style.color = "#10b981";

        const landmarks = results.multiHandLandmarks[0];
        const indexFinger = landmarks[8]; // Punta del dedo índice
        const thumb = landmarks[4];       // Punta del dedo pulgar

        // Invertir X para efecto espejo
        const handX = -(indexFinger.x * 2 - 1);
        const handY = -(indexFinger.y * 2 - 1);

        // Mover el puntero 3D según el dedo índice
        handCursor.position.x = handX * 2.5;
        handCursor.position.y = handY * 1.5;

        // Medir distancia entre índice y pulgar para detectar pinch (clic)
        const distance = Math.hypot(indexFinger.x - thumb.x, indexFinger.y - thumb.y);

        if (distance < 0.08) {
          if (!isPinching) {
            isPinching = true;
            handCursor.material.color.setHex(0x10b981); // Cambio a verde en clic
            triggerClickAt(handX, handY);
          }
        } else {
          isPinching = false;
          handCursor.material.color.setHex(0x38bdf8); // Restaurar azul
        }
      } else {
        statusElement.innerText = "Buscando mano...";
        statusElement.style.color = "#38bdf8";
      }
    }

    const hands = new Hands({
      locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`
    });

    hands.setOptions({
      maxNumHands: 1,
      modelComplexity: 1,
      minDetectionConfidence: 0.6,
      minTrackingConfidence: 0.6
    });

    hands.onResults(onHandResults);

    const cameraUtils = new Camera(videoElement, {
      onFrame: async () => {
        await hands.send({ image: videoElement });
      },
      width: 320,
      height: 240
    });

    cameraUtils.start().catch(() => {
      statusElement.innerText = "Cam no disponible (Usa mouse)";
      statusElement.style.color = "#ef4444";
    });

    // 5. Bucle de Animación
    const clock = new THREE.Clock();
    function animate() {
      requestAnimationFrame(animate);
      const elapsedTime = clock.getElapsedTime();
      spatialWindow.position.y = Math.sin(elapsedTime * 1.5) * 0.08;
      particlesMesh.rotation.y = elapsedTime * 0.03;
      renderer.render(scene, camera);
    }
    animate();

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });
  </script>
</body>
</html>
