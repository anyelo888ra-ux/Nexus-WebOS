<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nexus WebOS - PC Mode</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
    body {
      background: radial-gradient(circle at center, #1e1b4b, #0f172a);
      height: 100vh;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      color: #fff;
    }
    /* Barra Superior */
    .top-bar {
      height: 30px;
      background: rgba(15, 23, 42, 0.7);
      backdrop-filter: blur(12px);
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0 16px;
      font-size: 13px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
    }
    /* Contenedor de Ventanas */
    .desktop {
      height: calc(100vh - 100px);
      position: relative;
      padding: 20px;
    }
    .window {
      width: 400px;
      height: 250px;
      background: rgba(30, 41, 59, 0.85);
      backdrop-filter: blur(16px);
      border-radius: 12px;
      border: 1px solid rgba(255, 255, 255, 0.15);
      box-shadow: 0 20px 40px rgba(0,0,0,0.5);
      position: absolute;
      top: 60px;
      left: 60px;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    .window-header {
      height: 36px;
      background: rgba(255, 255, 255, 0.05);
      display: flex;
      align-items: center;
      padding: 0 12px;
      cursor: move;
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
    }
    .window-dots { display: flex; gap: 8px; }
    .dot { width: 12px; height: 12px; border-radius: 50%; }
    .dot-close { background: #ef4444; }
    .dot-min { background: #f59e0b; }
    .dot-max { background: #10b981; }
    .window-title { margin-left: 12px; font-size: 13px; opacity: 0.8; }
    .window-content { padding: 20px; flex: 1; font-size: 14px; color: #cbd5e1; }
    
    /* Dock Inferior */
    .dock-container {
      position: fixed;
      bottom: 12px;
      width: 100%;
      display: flex;
      justify-content: center;
    }
    .dock {
      background: rgba(15, 23, 42, 0.6);
      backdrop-filter: blur(20px);
      padding: 10px 16px;
      border-radius: 24px;
      display: flex;
      gap: 16px;
      border: 1px solid rgba(255, 255, 255, 0.15);
    }
    .dock-icon {
      width: 48px;
      height: 48px;
      background: linear-gradient(135deg, #3b82f6, #1d4ed8);
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 20px;
      cursor: pointer;
      transition: transform 0.2s ease;
    }
    .dock-icon:hover { transform: translateY(-8px) scale(1.1); }
  </style>
</head>
<body>
  <div class="top-bar">
    <div><strong>Nexus WebOS</strong> (PC Mode)</div>
    <div id="clock">00:00</div>
  </div>

  <div class="desktop">
    <div class="window">
      <div class="window-header">
        <div class="window-dots">
          <div class="dot dot-close"></div>
          <div class="dot dot-min"></div>
          <div class="dot dot-max"></div>
        </div>
        <span class="window-title">Bienvenido a Nexus WebOS</span>
      </div>
      <div class="window-content">
        <p>🚀 Sistema operativo activo en tu PC.</p>
        <br>
        <p>Servidor en ejecución. Listo para multitarea y sincronización.</p>
      </div>
    </div>
  </div>

  <div class="dock-container">
    <div class="dock">
      <div class="dock-icon">💻</div>
      <div class="dock-icon" style="background: linear-gradient(135deg, #10b981, #047857);">📁</div>
      <div class="dock-icon" style="background: linear-gradient(135deg, #8b5cf6, #6d28d9);">🌐</div>
      <div class="dock-icon" style="background: linear-gradient(135deg, #f59e0b, #b45309);">⚙️</div>
    </div>
  </div>

  <script>
    function updateClock() {
      const now = new Date();
      document.getElementById('clock').innerText = now.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
    }
    setInterval(updateClock, 1000);
    updateClock();
  </script>
</body>
</html>
